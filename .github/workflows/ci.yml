name: Bank Account Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Instalar dependencias Node.js
      run: npm install

    - name: Ejecutar pruebas Cypress
      uses: cypress-io/github-action@v5
      with:
        spec: cypress/e2e/cuenta_bancaria.cy.js

name: Pipeline Cypress básico

on:
  push:
    branches:
      - main

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - run: npm install

      - name: Instalar Cypress
        run: npx cypress install

      - run: npx cypress run --spec "cypress/e2e/cuenta_bancaria.cy.js"

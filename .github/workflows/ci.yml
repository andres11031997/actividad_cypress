name: Bank Account Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Ejecutar pruebas Cypress
        uses: cypress-io/github-action@v5
        with:
          browser: chrome
          spec: cypress/e2e/cuenta_bancaria.cy.js
